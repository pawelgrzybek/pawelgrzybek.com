baseURL = "https://pawelgrzybek.com/"
title = "pawelgrzybek.com"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
theme = ['pawelgrzybek']

[params]
  description = "I'm a software developer from Poland living in Northampton, UK. I'm a web standards enthusiast, accessibility advocate, and simplicity guardian. "

[frontmatter]
  date  = [":filename", ":default"]

[imaging]
  [imaging.avif]
    encoderSpeed = 8
  [imaging.webp]
    method = 4

[security.funcs]
  getenv = ['^COMMENTS_SERVERLESS_ACCESS_TOKEN$']

[caches.getresource]
  maxAge = 0

[permalinks]
  posts = "/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.RSS]
  baseName = "feed"

[outputFormats.JSON]
  baseName = "feed"

[markup]
  [markup.highlight]
    noClasses = false
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.extensions]
      footnote = true
